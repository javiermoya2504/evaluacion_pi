name: evaluacion-pi

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: evaluacion-pi-frontend:local
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: evaluacion-pi-backend:local
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXTAUTH_URL: http://localhost:3001
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/auth/providers"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: evaluacion-pi-email-worker:local
    env_file:
      - path: .env.local
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Evaluacion PI <no-reply@example.com>}
      EMAIL_ALLOW_CONSOLE: "true"
    depends_on:
      redis:
        condition: service_healthy
