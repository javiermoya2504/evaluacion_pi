name: CI

on:
  push:
    branches:
      - feature
      - dev
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Verify JWT secret
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: test -n "$JWT_SECRET"

      - name: Verify email secrets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          test -n "$EMAIL_FROM"
          if [ -n "$RESEND_API_KEY" ]; then
            exit 0
          fi
          test -n "$SMTP_HOST"
          test -n "$SMTP_USER"
          test -n "$SMTP_PASSWORD"

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build application (includes lint)
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_PROVIDER: console
          EMAIL_FROM: ci@example.com
          EMAIL_ALLOW_CONSOLE: "true"
